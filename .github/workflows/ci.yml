name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static analysis — byte-compile all modules
        run: python -m compileall -q agrista tests examples

      - name: Lint — flake8
        run: python -m flake8 agrista tests

      - name: Unit + integration tests
        run: python -m pytest tests/ -q --cov=agrista --cov-report=term

      - name: System test — interactive menu smoke test
        run: python menu_smoke_test.py

      - name: CLI entry point sanity check
        run: agrista --help >/dev/null && agrista --version

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1
      - name: Install package + gui extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"
      - name: GUI tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_gui_core.py tests/test_gui_window.py -q
