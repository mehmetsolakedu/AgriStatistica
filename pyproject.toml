[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrista"
version = "0.4.0"
description = "Tarımsal İstatistik Yazılımı — Agricultural Statistical Analysis Toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Agrista Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Agriculture",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Agriculture",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
    "click>=8.1.0",
    "plotly>=5.18",
]

[project.optional-dependencies]
viz = [
    "plotly>=5.15.0",
    "folium>=0.14.0",
]
gui = [
    "PySide6>=6.6",
    "pytest-qt>=4.2",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
agrista = "agrista.cli.main:main"
agrista-gui = "agrista.gui.main:main"

[tool.setuptools.packages.find]
include = ["agrista*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
